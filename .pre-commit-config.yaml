repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2000']  # vulns_db.json is ~1.4MB
      - id: detect-private-key

  # Commitizen: enforce conventional commit messages
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.4.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Bandit: Python AST Security Linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: ["-r", "discovery/"]

  # Gitleaks: Prevent Secret Leakage
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # Semgrep: SAST security scanner
  - repo: https://github.com/semgrep/semgrep
    rev: v1.156.0
    hooks:
      - id: semgrep
        args: ['--config', 'p/python', '--error']

  # Ruff: fast Python linter
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: true

  # Local hooks
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy
        entry: uv run mypy discovery/
        language: system
        pass_filenames: false
        always_run: true

# Gitleaks configuration for sciath-meta
# https://github.com/gitleaks/gitleaks

title = "sciath-meta gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"

paths = [
    '''\.venv/''',
    '''venv/''',
    '''\.pytest_cache/''',
    '''__pycache__/''',
    '''uv\.lock''',
]

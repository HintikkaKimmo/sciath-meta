[project]
name = "sciath-meta"
dynamic = ["version"]
description = "Build system integration plugins for Sciath CRA compliance automation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Sciath", email = "support@sciath.co"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["cra", "compliance", "yocto", "buildroot", "embedded", "sbom", "firmware"]
dependencies = []

[project.urls]
Homepage = "https://sciath.io"
Repository = "https://github.com/HintikkaKimmo/sciath-meta"
Issues = "https://github.com/HintikkaKimmo/sciath-meta/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "discovery/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["discovery"]

[tool.ruff]
target-version = "py311"
line-length = 130

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",  # Line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
